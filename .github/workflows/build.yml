name: Build Windows app

# Every push to main is built and tested. A release (which students get through "Update now") is made only
# when the change note contains [release], or when the workflow is started by hand ("Run workflow").
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      notes:
        description: "What's new (shown to students)"
        required: false

permissions:
  contents: write

jobs:
  # Full marking tests: model answers must get full marks. If any fails, nothing is built or released.
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install LibreOffice (recalculates the Excel formulas of the model answers)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-calc > /dev/null

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Every paper can be marked; checks for typing, saving and versions
        run: python tests/test_all.py

      - name: Mock 1 model answers score 100/100
        run: python tests/test_mock1.py

      - name: Excel model answers of Mocks 2-5 score full marks (original and retake numbers)
        run: python tests/test_excel_mocks.py

  build:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Check every paper can be marked
        run: python tests/test_all.py

      - name: Stamp the build number (used by the in-app updater)
        shell: pwsh
        run: '"BUILD = ${{ github.run_number }}" | Out-File -Encoding ascii skilltest/_build.py'

      - name: Build ISRO_SkillTest.exe
        run: >
          pyinstaller --noconfirm --onefile --windowed --name ISRO_SkillTest
          --collect-data docx --collect-data pptx --collect-data customtkinter --collect-data certifi
          --hidden-import win32com.client --hidden-import pythoncom --hidden-import msoffcrypto
          ISRO_SkillTest.py

      - name: Self-test the .exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\ISRO_SkillTest.exe -ArgumentList '--selftest','selftest.txt' -Wait -PassThru
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Fingerprint of the .exe (checked by the app before installing an update)
        shell: pwsh
        run: |
          $h = (Get-FileHash dist\ISRO_SkillTest.exe -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path dist\ISRO_SkillTest.exe.sha256 -Value "$h  ISRO_SkillTest.exe" -Encoding ascii -NoNewline
          Write-Host "SHA-256: $h"

      - uses: actions/upload-artifact@v4
        with:
          name: ISRO_SkillTest
          path: dist/ISRO_SkillTest.exe

      - name: Decide whether to release
        id: rel
        shell: pwsh
        env:
          MANUAL_NOTES: ${{ github.event.inputs.notes }}
        run: |
          $msg = git log -1 --pretty=%B
          $release = ("${{ github.event_name }}" -eq "workflow_dispatch") -or ($msg -match '\[release\]')
          $v = (Select-String -Path skilltest/__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          "release=$($release.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          "version=$v.${{ github.run_number }}" >> $env:GITHUB_OUTPUT
          if ($env:MANUAL_NOTES) { $msg = $env:MANUAL_NOTES }
          Set-Content -Path msg.txt -Value $msg -Encoding utf8
          Write-Host "Release: $release  Version: $v.${{ github.run_number }}"

      - name: Write release notes
        if: steps.rel.outputs.release == 'true'
        shell: pwsh
        run: |
          $lines = Get-Content msg.txt | Where-Object { $_ -notmatch '^(Co-Authored-By|Claude-Session):' } |
                   ForEach-Object { $_ -replace '\s*\[release\]', '' }
          $notes = ($lines -join "`n").Trim()
          $notes += "`n`n---`nDownload **ISRO_SkillTest.exe** below and double-click it, or press **Update now** inside the app.`n"
          $notes += "Windows may show 'Windows protected your PC' the first time: click More info > Run anyway.`n`n"
          $sha = Get-Content dist\ISRO_SkillTest.exe.sha256
          $notes += "SHA-256 fingerprint: ``$sha``"
          Set-Content -Path notes.md -Value $notes -Encoding utf8

      - name: Publish release
        if: steps.rel.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.rel.outputs.version }}
          name: ISRO Skill Test Practice v${{ steps.rel.outputs.version }}
          body_path: notes.md
          files: |
            dist/ISRO_SkillTest.exe
            dist/ISRO_SkillTest.exe.sha256
