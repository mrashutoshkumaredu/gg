name: Build Windows app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Check every paper can be marked
        run: python tests/test_all.py

      - name: Stamp the build number (used by the in-app updater)
        shell: pwsh
        run: '"BUILD = ${{ github.run_number }}" | Out-File -Encoding ascii skilltest/_build.py'

      - name: Build ISRO_SkillTest.exe
        run: >
          pyinstaller --noconfirm --onefile --windowed --name ISRO_SkillTest
          --collect-data docx --collect-data pptx --collect-data customtkinter
          --hidden-import win32com.client --hidden-import pythoncom --hidden-import msoffcrypto
          ISRO_SkillTest.py

      - name: Self-test the .exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\ISRO_SkillTest.exe -ArgumentList '--selftest','selftest.txt' -Wait -PassThru
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: ISRO_SkillTest
          path: dist/ISRO_SkillTest.exe

      - name: Write release notes
        shell: pwsh
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          $lines = $env:MSG -split "`n" | Where-Object { $_ -notmatch '^(Co-Authored-By|Claude-Session):' }
          $notes = ($lines -join "`n").Trim()
          $notes += "`n`n---`nDownload **ISRO_SkillTest.exe** below and double-click it, or press **Update now** inside the app.`n"
          $notes += "Windows may show 'Windows protected your PC' the first time: click More info > Run anyway."
          Set-Content -Path notes.md -Value $notes -Encoding utf8

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: ISRO Skill Test Practice v1.0.${{ github.run_number }}
          body_path: notes.md
          files: dist/ISRO_SkillTest.exe
